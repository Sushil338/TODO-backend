spring.application.name=TODO

#spring.datasource.url=jdbc:mysql://todo-mysql:3306/taskdb
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#app.cors.allowed-origin=http://16.170.236.230
app.cors.allowed-origin=https://yourfrontend.up.railway.app

groq.api.key=${GROQ_KEY_TODO}
groq.api.url=https://api.groq.com/openai/v1

spring.ai.openai.base-url=${groq.api.url}
spring.ai.openai.api-key=${groq.api.key}
spring.ai.openai.chat.options.model=llama3-8b-8192

jwt.secret=${JWT_SECRETtodo}

# Redis Configuration (For local development)
#spring.data.redis.host=todo-redis
#spring.data.redis.port=6379
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}

# Resend Mail Configuration
resend.api.key=${RESEND_API_KEYtodo}

server.port=${PORT:8080}